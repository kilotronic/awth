[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awth"
version = "2.1.1"
description = "Mock OAuth2 / OIDC server for local development and testing"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kilotronic LLC" }]
keywords = [
  "oauth2",
  "oidc",
  "openid-connect",
  "mock-server",
  "testing",
  "local-development",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kilotronic/awth"
Repository = "https://github.com/kilotronic/awth"
Issues = "https://github.com/kilotronic/awth/issues"

[project.optional-dependencies]
server = ["Flask>=3.1.0", "flask-cors>=4.0.0"]
dev = [
  "awth[server]",
  "pytest>=9.2.0",
  "pytest-cov>=7.0",
  "pre-commit>=4.0",
  # not ruff: it runs from the shared lint hooks (prek), at one pinned version
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
omit = ["tests/*", "venv/*", ".venv/*"]
