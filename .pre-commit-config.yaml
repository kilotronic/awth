default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b # frozen: v4.5.0
    hooks:
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short"]
      - id: build-local
        name: Build local container image
        entry: make build-local
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/kilotronic/checks
    rev: a6e8917fddb679077a2e8a427598ff1fd7a160ef # frozen: v1.0.0
    hooks:
      - id: data-leak-check # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push # pre-push: the commits being pushed
      - id: secret-scan # pre-commit: the staged changes
      - id: secret-scan-push # pre-push: the commits being pushed
      - id: ruff-format
      - id: prettier
      - id: shfmt
      - id: taplo-format
      - id: ruff-check
      - id: shellcheck
      - id: actionlint
      - id: markdownlint
      - id: yamllint
      - id: csv-lint
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: pinned
      - id: workflow-safety
      - id: non-root
      - id: git-identity
        args: ["--domain=ixid.net,kilotronic.com"] # quoted: a bare comma would split the list
        fail_fast: true
      - id: commit-subject
      - id: session-trailer
