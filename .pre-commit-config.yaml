default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short"]
      - id: build-local
        name: Build local container image
        entry: make build-local
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/kilotronic/data-leak-check
    rev: f1da8a7ce76bfaabd70ea815d9417fb691e95799  # v1.1.0
    hooks:
      - id: data-leak-check            # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push   # pre-push: the commits being pushed
