default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short"]
      - id: build-local
        name: Build local container image
        entry: make build-local
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/kilotronic/data-leak-check
    rev: f1da8a7ce76bfaabd70ea815d9417fb691e95799  # v1.1.0
    hooks:
      - id: data-leak-check            # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push   # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/secret-scan
    rev: 2665d6f2f0260d3ae0defbedcce27fc63ad6a168  # v1.2.1
    hooks:
      - id: secret-scan                # pre-commit: the staged changes
      - id: secret-scan-push           # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/lint
    rev: 50d58c6fc3916432a60d6caf5914d5bb83a60a16  # v1.1.0
    hooks:
      - id: shellcheck
      - id: actionlint
      - id: pinned
  - repo: https://github.com/kilotronic/git-identity
    rev: 5a7b91c3194870cf535ba8c37a6c93b19b5a933b  # v2.3.1
    hooks:
      - id: git-identity
        args: ["--domain=ixid.net,kilotronic.com"] # quoted: a bare comma would split the list
        fail_fast: true
