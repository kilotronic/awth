default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b # frozen: v4.5.0
    hooks:
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        args: ["-v", "--tb=short"]
      - id: build-local
        name: Build local container image
        entry: make build-local
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/kilotronic/data-leak-check
    rev: f1da8a7ce76bfaabd70ea815d9417fb691e95799 # frozen: v1.1.0
    hooks:
      - id: data-leak-check # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/secret-scan
    rev: 2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # frozen: v1.2.1
    hooks:
      - id: secret-scan # pre-commit: the staged changes
      - id: secret-scan-push # pre-push: the commits being pushed
  - repo: https://github.com/kilotronic/lint
    rev: b5343bfa69d890919c8774733da372d13d23d6d3 # frozen: v1.3.1
    hooks:
      - id: ruff-format
      - id: prettier
      - id: shfmt
      - id: taplo-format
      - id: ruff-check
      - id: shellcheck
      - id: actionlint
      - id: markdownlint
      - id: yamllint
      - id: csv-lint
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: pinned
      - id: workflow-safety
      - id: non-root
  - repo: https://github.com/kilotronic/git-identity
    rev: b0d54e809d81cabf61d357cbe519a9b9263b17cb # frozen: v2.4.0
    hooks:
      - id: git-identity
        args: ["--domain=ixid.net,kilotronic.com"] # quoted: a bare comma would split the list
        fail_fast: true
      - id: commit-subject
      - id: session-trailer
